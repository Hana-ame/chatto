name: build Authling image

on:
  pull_request:
    paths:
      - 'authling/**'
      - 'pkg/**'
      - 'go.work*'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/build-authling-image.yml'
  push:
    branches: [main]
    tags: ['authling/v*']
    # GitHub does not apply path filters to tag pushes.
    paths:
      - 'authling/**'
      - 'pkg/**'
      - 'go.work*'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/build-authling-image.yml'
  workflow_dispatch:

concurrency:
  group: authling-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve image metadata
        id: metadata
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          source = pathlib.Path("authling/version.go").read_text()
          version = re.search(r'const Version = "([^"]+)"', source).group(1)
          ref = os.environ["GITHUB_REF"]
          tag = sha
          if ref.startswith("refs/tags/"):
              prefix = "refs/tags/authling/v"
              if not ref.startswith(prefix):
                  raise SystemExit("Only authling/v release tags are supported")
              tag = ref[len(prefix):]
              # Docker tags cannot contain SemVer build metadata (+suffix).
              number = r"(?:0|[1-9][0-9]*)"
              identifier = r"(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
              semver = rf"{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?"
              if not re.fullmatch(semver, tag) or len(tag) > 128:
                  raise SystemExit("Release version is not a supported SemVer image tag")
              manifest = json.loads(pathlib.Path(".release-please-manifest.json").read_text())
              if tag != version or tag != manifest["authling"]:
                  raise SystemExit("Release tag, version.go and release manifest must agree")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={sha}\nversion={version}\ntag={tag}\n")

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: authling/Dockerfile
          platforms: linux/amd64
          load: true
          tags: authling:check
          cache-from: type=gha,scope=authling-amd64
          cache-to: type=gha,mode=max,scope=authling-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ steps.metadata.outputs.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Check executable
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          actual="$(docker run --rm --network none --read-only authling:check version)"
          test "$actual" = "authling version ${VERSION}"
      - name: Publish verified image
        # 【本地改动 2026-10-04】fork 跳过「推送到 chattocorp GHCR」：目标是
        # ghcr.io/chattocorp/authling，需要上游 org 的 GHCR 写权限，fork 的
        # GITHUB_TOKEN 没有（2026-10-04 实测必红：
        #   denied: permission_denied: The requested installation does not exist）。
        # 该 workflow 此前从未在 push main 上跑过——pull_request 的 paths 过滤不含
        # NOTICE/docs 之类，本次 push 改了 cli/NOTICE（删 heic2any 那行）才首次触发。
        # 与 build-docs-image.yml（24719ce64）、ci.yml publish-main-image
        # （432444410）同一处理：只禁用推送，保留上方构建 + 版本自检作为冒烟测试。
        # 用非常量条件而非 if: false——actionlint 的 [if-cond] 规则禁止常量条件
        # （ci.yml 的 publish-main-image 同样用 github.ref 避这条，见 432444410）。
        # 【恢复方式】fork 自建 authling 镜像时：把 IMAGE 换成 fork 的 GHCR 名，
        # 并把本行改回 github.event_name != 'pull_request'。
        if: github.repository == 'chattocorp/authling' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/chattocorp/authling:${{ steps.metadata.outputs.tag }}
        run: |
          docker tag authling:check "$IMAGE"
          docker push "$IMAGE"
          digest_ref="$(docker image inspect "$IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk '/^ghcr.io\/chattocorp\/authling@sha256:/ {print; exit}')"
          test -n "$digest_ref"
          {
            echo "Published ${IMAGE} (linux/amd64)."
            echo
            echo "Deploy ${digest_ref} to staging, verify it, then promote that same digest to production."
          } >> "$GITHUB_STEP_SUMMARY"
