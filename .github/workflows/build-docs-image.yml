name: build docs image

on:
  push:
    branches: [main]
    paths:
      - "apps/docs-website/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "LICENSES/Apache-2.0.txt"
      - "NOTICE"
  workflow_call:
    inputs:
      channel:
        description: "Documentation channel to publish."
        required: true
        type: string
      ref:
        description: "Git ref or SHA to build."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      channel:
        description: "Documentation channel to publish."
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stable
      ref:
        description: "Git ref or SHA to build. Defaults to the selected workflow ref."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-docs-image:
    # 【本地改动 2026-08-31】fork 只跳过「推送到 chattocorp GHCR」的动作，
    # 保留 docs 镜像的本地构建作为 Dockerfile 冒烟测试（与 ci.yml 里
    # publish-main-image 的既有处理方式一致）。
    # 【改动点】下方 Build docs image 步骤的 push 已置为 false，并把 tags 改为
    # 仅本地镜像引用；需要 chattocorp org 写权限的推送动作不再执行：
    #   failed to push ghcr.io/chattocorp/chatto-docs: denied: permission_denied
    # （08-31 实测必红，同一 commit 的 ci / build-release 均绿，确认是
    #   fork 基建缺口而非回归。）
    # 【避免 if: false】actionlint 的 [if-cond] 规则禁止常量条件
    # （08-30 ci.yml 踩过同款坑），所以不在 job 级加跳转，改为最细的
    # push 参数控制——需要权限的只有「推送」本身，构建不需要权限。
    # 【恢复方式】fork 若日后要自建 docs 镜像：把 ghcr.io/chattocorp/chatto-docs
    # 换成 fork 自己的 GHCR 名并将 push 改回 true；若要跟上游完全一致，删掉
    # 下方 Build 步骤里的 push/tags 本地注释即可。
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve image metadata
        id: image
        env:
          CHANNEL: ${{ inputs.channel || 'dev' }}
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          case "$CHANNEL" in
            dev)
              docs_tag="main-$(date -u +%Y%m%dT%H%M%SZ)-${sha:0:12}"
              docs_version="main"
              site_url="https://dev-docs.chatto.run"
              ;;
            stable)
              docs_tag="$(git describe --tags --exact-match --match 'v[0-9]*' HEAD)"
              if [[ ! "$docs_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Stable docs must be built from an exact stable vX.Y.Z tag; received ${docs_tag}."
                exit 1
              fi
              docs_version="$docs_tag"
              site_url="https://docs.chatto.run"
              ;;
            *)
              echo "::error::Unknown documentation channel: ${CHANNEL}"
              exit 1
              ;;
          esac

          {
            echo "sha=${sha}"
            echo "docs_tag=${docs_tag}"
            echo "docs_version=${docs_version}"
            echo "site_url=${site_url}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Docs image"
            echo
            echo "- Channel: \`${CHANNEL}\`"
            echo "- Version: \`${docs_version}\`"
            echo "- Commit: \`${sha}\`"
            echo "- Image: \`ghcr.io/chattocorp/chatto-docs:${docs_tag}\`"
            echo "- Site: \`${site_url}\`"
            echo "- Platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/docs-website/Dockerfile
          # 【本地改动 2026-08-31】push 置 false：推 ghcr.io/chattocorp/chatto-docs
          # 需要上游 org 的 GHCR 写权限，fork 的 GITHUB_TOKEN 没有（08-31 实测必红
          #   failed to push ...: denied: permission_denied）。只构建不推送，保留
          # Dockerfile 冒烟测试，与 ci.yml 里 publish-main-image 的既有处理一致。
          # 【恢复方式】fork 自建 docs 镜像时：把下方 tags 换成 fork 的 GHCR 名，
          # 并把本行改回 ${{ github.event_name != 'pull_request' }}。
          push: false
          platforms: linux/amd64
          tags: ghcr.io/chattocorp/chatto-docs:${{ steps.image.outputs.docs_tag }}
          build-args: |
            CHATTO_DOCS_CHANNEL=${{ inputs.channel || 'dev' }}
            CHATTO_DOCS_VERSION=${{ steps.image.outputs.docs_version }}
            CHATTO_DOCS_REVISION=${{ steps.image.outputs.sha }}
            CHATTO_DOCS_SITE_URL=${{ steps.image.outputs.site_url }}
          cache-from: type=gha,scope=chatto-docs-amd64
          cache-to: type=gha,mode=max,scope=chatto-docs-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.docs_version }}
            org.opencontainers.image.licenses=Apache-2.0
